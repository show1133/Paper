<!DOCTYPE html>
<html lang="zh-Hant" data-theme="qing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資訊管理課程－科技接受度研究</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#f3f6f6; --ink:#15202b; --soft:#4b5866;
    --faint:#7e8894; --rule:#dde2e3; --accent:#1f5f55; --accent-soft:#dde9e6;
    --head-bg:#15202b; --head-ink:#eef2f3;
  }
  html[data-theme="lan"]{
    --bg:#ffffff; --surface:#f0f3f9; --ink:#141b2b; --soft:#4a5468;
    --faint:#78839a; --rule:#dbe1ec; --accent:#2b4a8b; --accent-soft:#dde4f2;
    --head-bg:#141b2b; --head-ink:#eceff6;
  }
  html[data-theme="zhe"]{
    --bg:#fffdfc; --surface:#f7f1ef; --ink:#241a17; --soft:#5e4d47;
    --faint:#8c7a73; --rule:#e6dbd6; --accent:#8c3a2e; --accent-soft:#f2e0dc;
    --head-bg:#2c1c18; --head-ink:#f6ece9;
  }
  html[data-theme="ye"]{
    --bg:#11151a; --surface:#1a2027; --ink:#e4e9ef; --soft:#9aa6b2;
    --faint:#7a8894; --rule:#2a323c; --accent:#5fb7a3; --accent-soft:#1e3a35;
    --head-bg:#0b0e12; --head-ink:#e4e9ef;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
    font-size:15px; line-height:1.75;
    display:flex; flex-direction:column; overflow:hidden;
    transition:background .25s,color .25s;
  }

  /* ── 上框架 ───────────────────────────── */
  header{
    flex:none; background:var(--head-bg); color:var(--head-ink);
    padding:16px 28px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    transition:background .25s;
  }
  .brand h1{
    font-family:"Noto Serif TC",serif; font-weight:600; font-size:1.3rem;
    margin:0; letter-spacing:.03em;
  }
  .brand p{margin:2px 0 0; font-size:.78rem; opacity:.65}
  .palette{margin-left:auto; display:flex; align-items:center; gap:10px}
  .palette .label{font-size:.78rem; opacity:.65}
  .swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
    border:2px solid transparent; outline-offset:3px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .swatch[aria-pressed="true"]{border-color:var(--head-ink)}
  .sw-qing{background:#1f5f55}
  .sw-lan{background:#2b4a8b}
  .sw-zhe{background:#8c3a2e}
  .sw-ye{background:linear-gradient(135deg,#11151a 50%,#5fb7a3 50%)}

  /* ── 下方兩框架 ───────────────────────── */
  .body{flex:1; display:flex; min-height:0}

  nav{
    flex:none; width:252px; background:var(--surface);
    border-right:1px solid var(--rule); overflow-y:auto; padding:18px 0 32px;
    transition:background .25s;
  }
  nav h2{
    font-size:.74rem; font-weight:500; color:var(--faint);
    margin:0 0 10px; padding:0 20px;
  }
  nav button{
    display:block; width:100%; text-align:left; background:none; border:0;
    border-left:3px solid transparent; padding:11px 20px; cursor:pointer;
    color:var(--ink); font-family:inherit; font-size:.93rem; line-height:1.5;
  }
  nav button:hover{background:var(--accent-soft)}
  nav button[aria-current="true"]{
    border-left-color:var(--accent); background:var(--accent-soft);
    font-weight:500; color:var(--accent);
  }
  nav button .idx{
    font-family:"Noto Serif TC",serif; color:var(--faint);
    margin-right:9px; font-size:.9rem;
  }
  nav button[aria-current="true"] .idx{color:var(--accent)}
  nav button .en{display:block; font-size:.72rem; color:var(--faint); margin-left:26px}

  main{flex:1; overflow-y:auto; padding:30px 36px 72px; min-width:0}
  .sec-head{display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--ink); padding-bottom:8px}
  .sec-head h2{font-family:"Noto Serif TC",serif; font-weight:600; font-size:1.35rem; margin:0}
  .sec-head .en{font-size:.78rem; color:var(--faint); margin-left:auto}
  .lede{color:var(--soft); font-size:.93rem; margin:16px 0 22px; max-width:64ch}

  .table-scroll{overflow-x:auto; margin-bottom:30px}
  table{border-collapse:collapse; width:100%; min-width:820px; font-size:.85rem}
  th{
    text-align:left; font-weight:500; color:var(--soft); white-space:nowrap;
    border-bottom:2px solid var(--ink); padding:8px 10px;
  }
  td{border-bottom:1px solid var(--rule); padding:10px; vertical-align:top}
  td.n{color:var(--faint); text-align:right; width:2.4em}
  td.model{font-weight:500; min-width:9em}
  td.model small{display:block; font-weight:400; color:var(--faint); font-size:.88em}
  td.src{color:var(--soft); min-width:13em}
  td.yr{white-space:nowrap}
  td.c{white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums}
  .bar{display:block; height:3px; background:var(--accent); opacity:.5; margin-top:4px; margin-left:auto}
  td a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft); word-break:break-all}
  td a:hover{border-bottom-color:var(--accent)}

  figure{margin:0}
  .diagram{
    background:var(--surface); border:1px solid var(--rule);
    padding:26px 14px; text-align:center; overflow-x:auto; min-height:180px;
    display:flex; align-items:center; justify-content:center;
    transition:background .25s;
  }
  .diagram svg{max-width:100%; height:auto}
  .loading{color:var(--faint); font-size:.85rem}
  figcaption{font-size:.82rem; color:var(--faint); padding-top:10px}
  details{margin-top:10px; font-size:.82rem}
  summary{cursor:pointer; color:var(--accent); width:max-content}
  details pre{
    background:var(--bg); border:1px solid var(--rule); padding:14px;
    overflow-x:auto; font-size:.78rem; line-height:1.6; color:var(--ink);
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  .foot-note{margin-top:30px; padding-top:16px; border-top:1px solid var(--rule);
    font-size:.82rem; color:var(--faint); max-width:64ch}

  @media (max-width:860px){
    body{overflow:auto}
    .body{flex-direction:column}
    nav{width:100%; border-right:0; border-bottom:1px solid var(--rule);
      display:flex; overflow-x:auto; padding:0}
    nav h2{display:none}
    nav button{width:auto; white-space:nowrap; border-left:0; border-bottom:3px solid transparent}
    nav button[aria-current="true"]{border-left:0; border-bottom-color:var(--accent)}
    nav button .en{display:none}
    main{padding:22px 18px 56px}
    header{padding:14px 18px}
    .palette{width:100%; margin-left:0}
  }
</style>
</head>

</header>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shortUrl = u => { const t = u.replace(/^https?:\/\//,''); return t.length > 44 ? t.slice(0,42)+'…' : t; };
const fmt = n => '~' + n.toLocaleString('en-US');

let theme = 'qing';
let seq = 0;

function paint(src){
  const t = THEMES[theme];
  return (src + CLASSDEF)
    .replaceAll('__AF__',t.a[0]).replaceAll('__AS__',t.a[1]).replaceAll('__AT__',t.a[2])
    .replaceAll('__BF__',t.b[0]).replaceAll('__BS__',t.b[1]).replaceAll('__BT__',t.b[2])
    .replaceAll('__CF__',t.c[0]).replaceAll('__CS__',t.c[1]).replaceAll('__CT__',t.c[2]);
}

function initMermaid(){
  const t = THEMES[theme];
  mermaid.initialize({
    startOnLoad:false, theme:'base', securityLevel:'loose',
    fontFamily:'"Noto Sans TC", system-ui, sans-serif',
    themeVariables:{ darkMode:t.dark, fontSize:'14px', lineColor:t.line, textColor:t.ink,
      primaryColor:t.a[0], primaryBorderColor:t.a[1], primaryTextColor:t.a[2] },
    flowchart:{ curve:'basis', nodeSpacing:46, rankSpacing:64, padding:12 }
  });
}

function sectionHTML(s){
  const max = Math.max(...s.rows.map(r => r[5]));
  const body = s.rows.map((r,i) => `
    <tr>
      <td class="n">${i+1}</td>
      <td class="model">${esc(r[0])}<small>${esc(r[1])}</small></td>
      <td>${esc(r[2])}</td>
      <td class="src">${esc(r[3])}</td>
      <td class="yr">${r[4]}</td>
      <td class="c">${fmt(r[5])}<span class="bar" style="width:${Math.round(r[5]/max*72)}px"></span></td>
      <td><a href="${esc(r[6])}" target="_blank" rel="noopener">${esc(shortUrl(r[6]))}</a></td>
    </tr>`).join('');
  return `
  <div class="sec-head"><h2>${s.idx}、${s.name}</h2><span class="en">${s.en}</span></div>
  <p class="lede">${s.lede}</p>
  <div class="table-scroll">
    <table>
      <thead><tr><th>序號</th><th>模型名稱（中／英）</th><th>論文名稱／標題</th><th>出處</th><th>年份</th><th>約略引用數</th><th>URL</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>
  <figure>
    <div class="diagram" id="dg"><span class="loading">模型圖繪製中…</span></div>
    <figcaption>${esc(s.caption)}</figcaption>
    <details><summary>顯示 Mermaid 原始碼</summary><pre>${esc(s.diagram)}</pre></details>
  </figure>
  <p class="foot-note">引用數為 Google Scholar 量級估計，非精確值；專書類條目因版本分散，與 Scopus、Web of Science 可能有數倍差距，正式引用前請重新查證。</p>`;
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');
let current = SECTIONS[0].id;

SECTIONS.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.id = s.id;
  b.setAttribute('aria-current', s.id === current ? 'true' : 'false');
  b.innerHTML = `<span class="idx">${s.idx}</span>${s.name}<span class="en">${s.en}</span>`;
  b.addEventListener('click', () => select(s.id));
  nav.appendChild(b);
});

async function drawDiagram(s){
  const host = document.getElementById('dg');
  if (!host) return;
  try{
    const { svg } = await mermaid.render('mmd-' + (seq++), paint(s.diagram));
    host.innerHTML = svg;
  }catch(err){
    host.innerHTML = '<span class="loading">模型圖無法載入，請確認網路連線後重新整理。</span>';
  }
}

function select(id){
  current = id;
  nav.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const s = SECTIONS.find(x => x.id === id);
  main.innerHTML = sectionHTML(s);
  main.scrollTop = 0;
  drawDiagram(s);
}

document.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    theme = btn.dataset.theme;
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('.swatch').forEach(b =>
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    initMermaid();
    drawDiagram(SECTIONS.find(x => x.id === current));
  });
});

initMermaid();
select(current);
</script>
